<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>김시현 | Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header>

        <div class="container">
            <nav>
                <a href="#" class="logo">Portfolio</a>

                <ul class="nav-menu">
                    <li><a href="#about">About</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>

                <div class="nav-buttons">

                    <button id="theme-toggle" aria-label="Toggle to Dark theme">
                        theme
                    </button>

                    <button id="menu-toggle" aria-label="Open Menu">
                        menu
                    </button>

                </div>

            </nav>

        </div>

    </header>

    <main>
        <section id="hero">

            <div class="container">

                <h1 class="ternimal">
                    <span class="prompt">Sihyun Kim %</span>
                    <span id="typing"></span>
                    <span class="cursor">█</span>
                </h1>

                <p id="start-message">Click or Press Enter to Start</p>

                <p id="hero-description" class="hidden">
                    instruductions..
                </p>

                <a href="#projects" class="btn hidden" id="hero-button">
                    <span class="text">
                        <span>See Projects..</span>
                    </span>
                </a>

            </div>

        </section>
        
        <section id="about" class="fade-in">

            <div class="container">

                <h2>ABOUT ME</h2>

                <div class="about-image">
                    <img src="images/profile.png" alt="Profile Image">
                </div>

                <p>

                </p>

            </div>

        </section>

        <section id="skills" class="fade-in">

            <div class="container">

                <h2>SKILLS</h2>

                <ul>

                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                    <li>Python</li>

                </ul>

            </div>

        </section>

        <section id="projects" class="fade-in">

            <div class="container">

                <h2>PROJECTS</h2>

                <div id="project-list">

                </div>

            </div>

        </section>

        <section id="contact" class="fade-in">

            <div class="container">

                <h2>CONTACT ME</h2>

                <form id="contact-form">

                    <label for="name">이름</label>
                    <input type="text" id="name" name="name">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email">
                    <label for="message">메세지</label>
                    <textarea id="message" name="message"></textarea>

                    <button type="submit" class="btn">
                        <span class="text">
                            <span>SUBMIT</span>
                        </span>
                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer>

        <div class="container">

            <p class="copyright">
                © 2026 Sihyun Kim. All Rights Reserved.
            </p>

        </div>

    </footer>

<script type="module" src="js/main.js"></script>
    
</body>

</html>
